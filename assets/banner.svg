<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Alex Ventura banner - software desarrollo SQL">
  <title>Alex Ventura - software, desarrollo, SQL</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="45%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#140a1e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-opacity=".55" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><rect x="792" y="102" width="256" height="130" rx="6"/></clipPath>
    <style><![CDATA[
      .name{font-family:"Courier New",ui-monospace,monospace;font-size:56px;font-weight:800;letter-spacing:2px}
      .role{font-family:"Courier New",ui-monospace,monospace;font-size:20px;font-weight:700;letter-spacing:5px;fill:#22d3ee}
      .tag{font-family:"Courier New",ui-monospace,monospace;font-size:15px;letter-spacing:3px;fill:#64748b}
      .b{font-family:"Courier New",ui-monospace,monospace;font-size:17px;font-weight:700;text-anchor:middle}
      @keyframes f1{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
      @keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
      @keyframes glitchA{0%,100%{transform:translate(0,0);opacity:.9}20%{transform:translate(-4px,1px);opacity:.55}40%{transform:translate(3px,-2px);opacity:.85}60%{transform:translate(-2px,2px);opacity:.45}80%{transform:translate(4px,-1px);opacity:.8}}
      @keyframes glitchB{0%,100%{transform:translate(0,0);opacity:.7}25%{transform:translate(4px,-1px);opacity:.4}50%{transform:translate(-3px,2px);opacity:.85}75%{transform:translate(2px,1px);opacity:.35}}
      @keyframes scrollCode{0%{transform:translateY(0)}100%{transform:translateY(-132px)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes sweep{0%{transform:translateY(-100px);opacity:0}12%{opacity:.8}88%{opacity:.8}100%{transform:translateY(330px);opacity:0}}
      @keyframes dash{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-160}}
      @keyframes flick{0%,100%{opacity:.95}47%{opacity:.6}49%{opacity:.95}72%{opacity:.7}}
      @keyframes pix{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:.75;transform:translateY(-14px)}}
      .code{animation:scrollCode 7s linear infinite}
      .cursor{animation:blink 1s steps(1) infinite}
      .sweep{animation:sweep 6s linear infinite}
      .frame{animation:dash 8s linear infinite}
      .screen{animation:flick 4s ease-in-out infinite}
    ]]></style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#neon)" stroke-width="2" stroke-dasharray="60 22" opacity=".5" class="frame"/>
  <rect x="0" y="0" width="1200" height="90" fill="url(#scan)" opacity=".25" class="sweep"/>

  <g fill="#22d3ee">
    <rect x="120" y="250" width="7" height="7" class="pix" style="animation:pix 4.2s ease-in-out infinite"/>
    <rect x="300" y="70" width="6" height="6" fill="#a855f7" class="pix" style="animation:pix 5.1s ease-in-out .6s infinite"/>
    <rect x="470" y="280" width="6" height="6" fill="#f472b6" class="pix" style="animation:pix 3.7s ease-in-out 1.2s infinite"/>
    <rect x="640" y="60" width="7" height="7" fill="#4ade80" class="pix" style="animation:pix 4.8s ease-in-out .3s infinite"/>
    <rect x="60" y="120" width="5" height="5" class="pix" style="animation:pix 5.6s ease-in-out 1.6s infinite"/>
    <rect x="560" y="180" width="6" height="6" fill="#a855f7" class="pix" style="animation:pix 4.4s ease-in-out .9s infinite"/>
  </g>

  <g>
    <text x="64" y="128" class="name" fill="#22d3ee" opacity=".8" style="transform-origin:64px 128px;animation:glitchA 5s steps(1) infinite">ALEX VENTURA</text>
    <text x="64" y="128" class="name" fill="#f472b6" opacity=".7" style="transform-origin:64px 128px;animation:glitchB 4.4s steps(1) infinite">ALEX VENTURA</text>
    <text x="64" y="128" class="name" fill="url(#neon)" filter="url(#glow)">ALEX VENTURA</text>
  </g>

  <text x="64" y="182" class="role">SOFTWARE · DESARROLLO</text>
  <text x="64" y="212" class="tag">// SQL &amp; BASES DE DATOS</text>

  <g>
    <rect x="64" y="240" width="196" height="34" rx="17" fill="none" stroke="#22d3ee" stroke-opacity=".55"/>
    <circle cx="86" cy="257" r="4" fill="#4ade80" style="animation:blink 1.6s steps(1) infinite"/>
    <text x="102" y="263" class="tag" style="font-size:12px;letter-spacing:2px;fill:#7dd3fc">ABIERTO A PROYECTOS</text>
  </g>

  <g>
    <rect x="780" y="88" width="280" height="160" rx="14" fill="#0b1220" stroke="#1e293b" stroke-width="3"/>
    <rect x="792" y="102" width="256" height="130" rx="6" fill="#050810"/>
    <g class="screen">
      <g clip-path="url(#screenClip)">
        <g class="code" style="transform-origin:920px 102px">
          <rect x="802" y="112" width="90" height="6" rx="3" fill="#a855f7" opacity=".85"/>
          <rect x="812" y="134" width="150" height="6" rx="3" fill="#94a3b8" opacity=".6"/>
          <rect x="812" y="156" width="110" height="6" rx="3" fill="#22d3ee" opacity=".85"/>
          <rect x="822" y="178" width="170" height="6" rx="3" fill="#4ade80" opacity=".7"/>
          <rect x="812" y="200" width="70" height="6" rx="3" fill="#f472b6" opacity=".8"/>
          <rect x="822" y="222" width="130" height="6" rx="3" fill="#94a3b8" opacity=".55"/>
          <rect x="802" y="244" width="90" height="6" rx="3" fill="#a855f7" opacity=".85"/>
          <rect x="812" y="266" width="150" height="6" rx="3" fill="#94a3b8" opacity=".6"/>
          <rect x="812" y="288" width="110" height="6" rx="3" fill="#22d3ee" opacity=".85"/>
          <rect x="822" y="310" width="170" height="6" rx="3" fill="#4ade80" opacity=".7"/>
          <rect x="812" y="332" width="70" height="6" rx="3" fill="#f472b6" opacity=".8"/>
          <rect x="822" y="354" width="130" height="6" rx="3" fill="#94a3b8" opacity=".55"/>
          <rect x="802" y="376" width="90" height="6" rx="3" fill="#a855f7" opacity=".85"/>
          <rect x="812" y="398" width="150" height="6" rx="3" fill="#94a3b8" opacity=".6"/>
          <rect x="812" y="420" width="110" height="6" rx="3" fill="#22d3ee" opacity=".85"/>
          <rect x="822" y="442" width="170" height="6" rx="3" fill="#4ade80" opacity=".7"/>
          <rect x="812" y="464" width="70" height="6" rx="3" fill="#f472b6" opacity=".8"/>
          <rect x="822" y="486" width="130" height="6" rx="3" fill="#94a3b8" opacity=".55"/>
        </g>
        <rect x="792" y="212" width="256" height="20" fill="#050810" opacity=".9"/>
        <text x="802" y="227" class="tag" style="font-size:12px;fill:#4ade80;letter-spacing:0">&#62;</text>
        <rect x="816" y="216" width="9" height="12" fill="#22d3ee" class="cursor"/>
      </g>
    </g>
    <rect x="895" y="248" width="50" height="18" fill="#1e293b"/>
    <rect x="851" y="266" width="138" height="10" rx="5" fill="#1e293b"/>
    <circle cx="1040" cy="100" r="3" fill="#4ade80" style="animation:blink 2s steps(1) infinite"/>
  </g>

  <g style="transform-origin:690px 40px;animation:f2 5.4s ease-in-out 1.3s infinite">
    <circle cx="690" cy="40" r="22" fill="#00758F"/>
    <text x="690" y="46" class="b" fill="#fff" style="font-size:14px">SQL</text>
  </g>
  <g style="transform-origin:742px 52px;animation:f1 5.2s ease-in-out infinite">
    <circle cx="742" cy="52" r="22" fill="#F7DF1E"/>
    <text x="742" y="58" class="b" fill="#111">JS</text>
  </g>
  <g style="transform-origin:876px 36px;animation:f2 4.6s ease-in-out .4s infinite">
    <circle cx="876" cy="36" r="22" fill="#3178C6"/>
    <text x="876" y="42" class="b" fill="#fff">TS</text>
  </g>
  <g style="transform-origin:1010px 44px;animation:f1 5.8s ease-in-out .9s infinite">
    <circle cx="1010" cy="44" r="22" fill="#0b1220" stroke="#61DAFB" stroke-width="2"/>
    <g stroke="#61DAFB" stroke-width="1.8" fill="none">
      <ellipse cx="1010" cy="44" rx="15" ry="6"/>
      <ellipse cx="1010" cy="44" rx="15" ry="6" transform="rotate(60 1010 44)"/>
      <ellipse cx="1010" cy="44" rx="15" ry="6" transform="rotate(120 1010 44)"/>
    </g>
    <circle cx="1010" cy="44" r="2.6" fill="#61DAFB"/>
  </g>
  <g style="transform-origin:1116px 86px;animation:f2 5.4s ease-in-out .2s infinite">
    <circle cx="1116" cy="86" r="22" fill="#3776AB"/>
    <text x="1116" y="92" class="b" fill="#FFD43B">PY</text>
  </g>
  <g style="transform-origin:1130px 196px;animation:f1 4.9s ease-in-out 1.1s infinite">
    <circle cx="1130" cy="196" r="22" fill="#5FA04E"/>
    <text x="1130" y="202" class="b" fill="#fff">N</text>
  </g>
  <g style="transform-origin:1050px 262px;animation:f2 5.6s ease-in-out .7s infinite">
    <circle cx="1050" cy="262" r="22" fill="#00599C"/>
    <text x="1050" y="268" class="b" fill="#fff" style="font-size:15px">C++</text>
  </g>
  <g style="transform-origin:912px 286px;animation:f1 4.4s ease-in-out 1.5s infinite">
    <circle cx="912" cy="286" r="22" fill="#00ADD8"/>
    <text x="912" y="292" class="b" fill="#062a33">GO</text>
  </g>
  <g style="transform-origin:770px 258px;animation:f2 5.9s ease-in-out .5s infinite">
    <circle cx="770" cy="258" r="22" fill="#CE422B"/>
    <text x="770" y="264" class="b" fill="#fff">R</text>
  </g>
  <g style="transform-origin:700px 160px;animation:f1 5s ease-in-out 1.8s infinite">
    <circle cx="700" cy="160" r="22" fill="#E76F00"/>
    <text x="700" y="166" class="b" fill="#fff">JV</text>
  </g>
  <g style="transform-origin:640px 288px;animation:f2 4.8s ease-in-out 1s infinite">
    <circle cx="640" cy="288" r="22" fill="#E34F26"/>
    <text x="640" y="294" class="b" fill="#fff" style="font-size:14px">HTML</text>
  </g>
  <g style="transform-origin:600px 44px;animation:f1 5.3s ease-in-out .8s infinite">
    <circle cx="600" cy="44" r="22" fill="#264DE4"/>
    <text x="600" y="50" class="b" fill="#fff" style="font-size:15px">CSS</text>
  </g>
</svg>
